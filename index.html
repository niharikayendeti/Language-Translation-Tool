<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .translator {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        .language-box {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        select {
            width: 50%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .translate-button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .translate-button:hover {
            background: #1d4ed8;
        }

        .output {
            margin-top: 25px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }

        .output h3 {
            margin-top: 0;
            color: #333;
        }

        #result {
            color: #444;
            line-height: 1.6;
            min-height: 30px;
        }

        .copy-button {
            margin-top: 12px;
            padding: 10px 18px;
            border: 1px solid #2563eb;
            border-radius: 7px;
            background: white;
            color: #2563eb;
            cursor: pointer;
        }

        .copy-button:hover {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div class="translator">

        <h1>Language Translation Tool</h1>

        <p class="description">
            Translate text quickly between different languages
        </p>

        <textarea
            id="text"
            placeholder="Enter your text here...">
        </textarea>

        <div class="language-box">

            <select id="source">
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>

            <select id="target">
                <option value="te">Telugu</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>

        </div>

        <button class="translate-button" onclick="translateText()">
            Translate
        </button>

        <div class="output">

            <h3>Translated Text</h3>

            <p id="result">
                Your translation will appear here.
            </p>

            <button class="copy-button" onclick="copyTranslation()">
                Copy Translation
            </button>

        </div>

    </div>

    <script>

        async function translateText() {

            const text = document.getElementById("text").value.trim();
            const source = document.getElementById("source").value;
            const target = document.getElementById("target").value;
            const result = document.getElementById("result");

            if (text === "") {
                result.innerText = "Please enter some text.";
                return;
            }

            result.innerText = "Translating...";

            const url =
                "https://api.mymemory.translated.net/get?q=" +
                encodeURIComponent(text) +
                "&langpair=" +
                source +
                "|" +
                target;

            try {

                const response = await fetch(url);
                const data = await response.json();

                result.innerText =
                    data.responseData.translatedText;

            } catch (error) {

                result.innerText =
                    "Translation failed. Please check your internet connection.";

            }
        }

        function copyTranslation() {

            const text =
                document.getElementById("result").innerText;

            navigator.clipboard.writeText(text);

            alert("Translation copied successfully.");
        }

    </script>

</body>
</html>
``
